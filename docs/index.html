<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setp API 文档</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.35.0/swagger-ui.css" />
    <style>
      body {
        margin: 0;
        background: #fff;
        color: #1f2328;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .doc-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 24px;
        border-bottom: 1px solid #d8dee4;
      }
      .doc-header strong {
        font-size: 16px;
      }
      .doc-header span {
        color: #59636e;
        font-size: 13px;
      }
      .doc-notice {
        margin: 16px 24px 0;
        padding: 10px 14px;
        border: 1px solid #d8dee4;
        border-radius: 6px;
        background: #f6f8fa;
        color: #59636e;
        font-size: 13px;
      }
      .swagger-ui .topbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <header class="doc-header">
      <strong>Setp API</strong>
      <span>静态接口文档</span>
    </header>
    <p class="doc-notice">本页仅展示接口定义；示例请求请在本地启动后端后调试。</p>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.35.0/swagger-ui-bundle.js"></script>
    <script>
      window.addEventListener("load", function () {
        window.ui = SwaggerUIBundle({
          url: "./api/openapi.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          docExpansion: "list",
          defaultModelsExpandDepth: -1,
          displayRequestDuration: true,
          filter: true,
          supportedSubmitMethods: [],
          presets: [SwaggerUIBundle.presets.apis],
        });
      });
    </script>
  </body>
</html>
