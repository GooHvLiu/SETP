name: 缺陷报告
description: 报告可复现的缺陷
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue。安全漏洞不要公开提交，请按 SECURITY.md 的私密入口报告。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 认证 / 权限 / 会话
        - 配置 / 字典 / 菜单
        - 邮件 / 通知 / 帮助中心
        - 数据库 / 迁移 / seed
        - Docker / 部署
        - 文档 / CI
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 写出实际执行的命令、请求或操作顺序。
      placeholder: |
        1. 在仓库根目录执行 ...
        2. 请求 ...
        3. 观察 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附完整报错、日志或截图，不要只写“报错”。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node 版本、数据库类型与版本、提交 SHA。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 已尝试的排查、影响面、是否阻塞使用。
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 已搜索现有 Issue，未发现重复
          required: true
        - label: 已移除日志中的密钥、token 与个人信息
          required: true
