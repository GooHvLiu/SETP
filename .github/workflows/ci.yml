name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            db_type: sqlite
            image: mysql:8.0
            database_url: file:./data/ci.db
          - db: mysql-8.0
            db_type: mysql
            image: mysql:8.0
            database_url: mysql://root:root@127.0.0.1:3306/setp_ci
          - db: mariadb-10.6
            db_type: mysql
            image: mariadb:10.6
            database_url: mysql://root:root@127.0.0.1:3306/setp_ci

    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: setp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: true
      NODE_ENV: test
      APP_PORT: 3107
      DB_TYPE: ${{ matrix.db_type }}
      DATABASE_URL: ${{ matrix.database_url }}
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      CONFIG_SECRET_KEY: ci-only-config-secret-0123456789abcdef
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "123456"
      SUPER_ADMIN_PASSWORD: "superAdmin123456@"
      ADMIN_RESET_PASSWORD: "123456"
      LOGIN_RATE_LIMIT_MAX: "100"
      LOGIN_RATE_LIMIT_WINDOW_MIN: "1"
      RATE_LIMIT_MAX: "10000"
      LOG_CONSOLE: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Generate TSOA routes and OpenAPI
        run: npm run tsoa

      - name: Static quality gates
        run: npm run check

      - name: Check OpenAPI and handwritten route contracts
        run: npm run contract:check

      - name: Prepare database
        run: npm run db:prepare

      - name: Check database drift
        run: npm run db:drift

      - name: Run contract, RBAC, ops and Vitest suites with coverage
        run: npm run test:ci

      - name: Build production bundle
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.db }}
          path: coverage/
          if-no-files-found: warn

      - name: Start API server
        run: |
          node dist/app.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/ready" >/dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start"
          cat server.log
          exit 1

      - name: Run full HTTP smoke tests
        run: npm run test:api

      - name: Stop API server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
          cat server.log || true
  compat:
  name: compat (node ${{ matrix.node }})
  runs-on: ubuntu-latest
  timeout-minutes: 30
  strategy:
    fail-fast: false
    matrix:
      node: [20.19.0, 24]
  env:
    CI: true
    NODE_ENV: test
    APP_PORT: 3107
    DB_TYPE: sqlite
    DATABASE_URL: file:./data/ci-node.db
    JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
    CONFIG_SECRET_KEY: ci-only-config-secret-0123456789abcdef
    ADMIN_USERNAME: admin
    ADMIN_PASSWORD: "123456"
    SUPER_ADMIN_PASSWORD: "superAdmin123456@"
    ADMIN_RESET_PASSWORD: "123456"
    LOGIN_RATE_LIMIT_MAX: "100"
    LOGIN_RATE_LIMIT_WINDOW_MIN: "1"
    RATE_LIMIT_MAX: "10000"
    LOG_CONSOLE: "false"
  steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        cache: npm

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Generate Prisma Client
      run: npm run db:generate

    - name: Static quality gates
      run: npm run check

    - name: Prepare database
      run: npm run db:prepare

    - name: Run unit tests
      run: npm run test:unit

    - name: Build production bundle
      run: npm run build

  docker:
    name: docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: setp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t setp-backend:ci .

      - name: Start image against MySQL and verify readiness
        run: |
          docker run -d --name setp-ci --network host \
            -e NODE_ENV=production \
            -e APP_PORT=3108 \
            -e APP_HOST=0.0.0.0 \
            -e DB_TYPE=mysql \
            -e DATABASE_URL=mysql://root:root@127.0.0.1:3306/setp_ci \
            -e DB_POOL_SIZE=10 \
            -e CORS_ORIGINS=http://localhost:5173 \
            -e JWT_SECRET=setp-docker-jwt-9f3a2c7e5b1d4a80 \
            -e JWT_EXPIRES_IN=15m \
            -e JWT_REFRESH_EXPIRES_IN=7d \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=CiAdmin-9f3a2c7e \
            -e SUPER_ADMIN_PASSWORD=CiSuper-7c1e5a9b \
            -e ADMIN_RESET_PASSWORD=CiReset-3d2f4860 \
            -e CONFIG_SECRET_KEY=setp-docker-config-7c1e5a9b3d2f4860 \
            -e TZ=Asia/Shanghai \
            setp-backend:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3108/ready >/dev/null; then
              echo "container ready"
              exit 0
            fi
            sleep 2
          done
          docker logs setp-ci
          exit 1

      - name: Check container database drift
        run: docker exec setp-ci npm run db:drift

      - name: Stop container
        if: always()
        run: docker rm -f setp-ci || true
